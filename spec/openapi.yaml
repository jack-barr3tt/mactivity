openapi: 3.0.3
info:
  title: mactivity
  version: 0.1.0
  description: |
    Query the local activity log. Windows are half-open: a segment counts when it overlaps [from, to).
    Duration uses the overlap only, clipped to that window. An open segment is treated as ending at the earlier of now and to.
servers:
  - url: http://127.0.0.1:8787
paths:
  /v1/activity:
    get:
      operationId: listActivity
      summary: Segments overlapping a time window
      parameters:
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
      responses:
        "200":
          description: Segments clipped to the window, oldest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Segment"
        "400":
          $ref: "#/components/responses/BadRequest"
  /v1/summary:
    get:
      operationId: summarizeTime
      summary: Time spent, grouped by hostname or app
      parameters:
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - name: group
          in: query
          required: true
          description: Group totals by Chrome hostname or by application name.
          schema:
            type: string
            enum: [hostname, app]
        - name: contains
          in: query
          required: false
          description: |
            Case-insensitive substring matched against app name, window title, URL, and hostname.
            `jira` matches a tab whose URL or title contains jira even when the host is `company.atlassian.net`.
          schema:
            type: string
      responses:
        "200":
          description: Totals, highest duration first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Summary"
        "400":
          $ref: "#/components/responses/BadRequest"
  /v1/current:
    get:
      operationId: currentActivity
      summary: The segment that is in the foreground now
      responses:
        "200":
          description: Open segment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Segment"
        "404":
          description: Nothing is being recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  parameters:
    From:
      name: from
      in: query
      required: true
      description: Window start, inclusive.
      schema:
        type: string
        format: date-time
    To:
      name: to
      in: query
      required: true
      description: Window end, exclusive.
      schema:
        type: string
        format: date-time
  responses:
    BadRequest:
      description: Invalid query
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Segment:
      type: object
      required: [id, startedAt, appName, bundleId]
      properties:
        id:
          type: integer
          format: int64
        startedAt:
          type: string
          format: date-time
        endedAt:
          type: string
          format: date-time
          nullable: true
        appName:
          type: string
        bundleId:
          type: string
        windowTitle:
          type: string
          nullable: true
        url:
          type: string
          nullable: true
        hostname:
          type: string
          nullable: true
    Summary:
      type: object
      required: [key, seconds]
      properties:
        key:
          type: string
        seconds:
          type: number
          format: double
          description: Overlap with the requested window, in seconds.
    Error:
      type: object
      required: [message]
      properties:
        message:
          type: string
